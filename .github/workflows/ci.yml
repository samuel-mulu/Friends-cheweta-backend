name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      redis:
        image: redis:7
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: ci
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U ci -d ci"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      # Throwaway service containers, reachable only inside this job.
      DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
      REDIS_TEST_URL: redis://127.0.0.1:6379

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Every migration applies to an empty database
        run: npx prisma migrate deploy

      - name: Lint
        run: npm run lint:check

      - name: Type-check
        run: npx tsc --noEmit

      - name: Unit and Redis tests
        run: npm test

      - name: Fuzz the Ludo rules
        run: npm run fuzz:ludo

      - name: Fuzz the Dama rules
        run: npm run fuzz:dama
