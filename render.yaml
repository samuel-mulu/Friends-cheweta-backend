# Render Blueprint — Friends Game Hub API
#
# Use when this repo root IS friends-game-backend-b0-b20.
# For a monorepo parent folder, use ../render.yaml instead (rootDir set there).
#
# IMPORTANT (Redis):
# - Do NOT paste REDIS_URL=redis://127.0.0.1:6379 from local .env into Render.
# - REDIS_URL is wired automatically from the Key Value instance below.
# - If you manually set REDIS_URL in the dashboard, delete it so the link below applies.
#
# After first deploy:
#   1. Set secret env vars in the Render dashboard (DATABASE_URL, JWT secrets, etc.).
#   2. Open Shell once: npm run deploy:seed
#   3. Point Vercel admin at https://<this-service>.onrender.com

services:
  - type: keyvalue
    name: friends-game-redis
    plan: starter
    maxmemoryPolicy: allkeys-lru
    ipAllowList: []

  - type: web
    name: friends-game-api
    runtime: node
    plan: starter
    region: frankfurt
    buildCommand: npm install --include=dev && npm run build
    startCommand: npm run start:prod
    releaseCommand: npx prisma migrate deploy
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: friends-game-redis
          property: connectionString
      - key: REDIS_KEY_PREFIX
        value: friends-game-prod
      - key: REDIS_RUNTIME_TTL_SECONDS
        value: "86400"
      - key: REDIS_COMMAND_TTL_SECONDS
        value: "86400"
      - key: REDIS_PRESENCE_TTL_SECONDS
        value: "90"
      - key: REDIS_MATCHMAKING_TTL_SECONDS
        value: "600"
      - key: REDIS_LOCK_TTL_MS
        value: "5000"
      - key: JWT_ACCESS_TTL
        value: 15m
      - key: JWT_REFRESH_TTL
        value: 30d
      - key: LUDO_MAX_CONSECUTIVE_TIMEOUTS
        value: "3"
      - key: LUDO_DISCONNECT_GRACE_SECONDS
        value: "90"
      - key: LUDO_READY_NO_SHOW_SECONDS
        value: "180"
      - key: PREMATCH_ORPHAN_TIMEOUT_SECONDS
        value: "600"
      - key: DATABASE_URL
        sync: false
      - key: DIRECT_DATABASE_URL
        sync: false
      - key: DATABASE_POOL_MAX
        value: "15"
      - key: JWT_ACCESS_SECRET
        sync: false
      - key: JWT_REFRESH_SECRET
        sync: false
      - key: CORS_ORIGINS
        sync: false
